<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Add User</title>
  <style>
    :root{
      --bg:#f3f6fb;
      --card:#ffffff;
      --accent:#4A6CF7;
      --muted:#6b7280;
      --input-bg:#fafbfd;
      --radius:10px;
      --gap:16px;
      --maxw:1100px;
    }
*{box-sizing:border-box;}
body{
  margin:0;
  font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial;
  background:var(--bg);
  color:#111827;
}

.page {
  max-width: var(--maxw);
  margin: 36px auto;
  padding: 20px;
}

.top-bar{
  display:flex;
  justify-content:flex-start;
  gap:12px;
  align-items:center;
  margin-bottom:18px;
}

.back-btn{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:10px 14px;
  border-radius:8px;
  background:#eef2ff;
  color:#1f2937;
  text-decoration:none;
  border:1px solid #dbe4ff;
  font-weight:600;
  transition:transform .12s ease, background .12s ease;
}
.back-btn:hover{ transform:translateY(-2px); background:#e2ecff; }

.card{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:0 10px 30px rgba(16,24,40,0.06);
  padding:28px;
}

h2{
  margin:0 0 18px 0;
  text-align:center;
  font-size:22px;
  letter-spacing:0.2px;
}

form{ width:100%; }

.grid-3{
  display:grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--gap);
  margin-bottom:18px;
}

.grid-2{
  display:grid;
  grid-template-columns: repeat(2, 1fr);
  gap: var(--gap);
  margin-bottom:18px;
}

.grid-full{
  margin-bottom:18px;
}

label{
  display:block;
  margin-bottom:6px;
  font-weight:600;
  color:var(--muted);
  font-size:13px;
}

input[type="text"],
input[type="email"],
input[type="number"],
input[type="password"],
textarea{
  width:100%;
  padding:12px 14px;
  border-radius:10px;
  border:1px solid #e6e9ef;
  background:var(--input-bg);
  font-size:14px;
  transition:box-shadow .12s ease, border-color .12s ease, background .12s ease;
}

input:focus, textarea:focus{
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 6px 18px rgba(74,108,247,0.12);
  background:#fff;
}

textarea{ min-height:90px; resize:vertical; }

small{
  display:block;
  text-align:right;
  color:gray;
  font-size:12px;
  margin-top:4px;
}

.actions{
  margin-top:8px;
  display:flex;
  gap:12px;
  align-items:center;
  justify-content:flex-end;
}

.btn {
  padding:12px 18px;
  border-radius:10px;
  border:none;
  cursor:pointer;
  font-weight:700;
  font-size:14px;
}

.btn-primary{
  background:linear-gradient(135deg,var(--accent),#2643e9);
  color:white;
  box-shadow:0 8px 20px rgba(38,67,233,0.12);
}

.btn-secondary{
  background:#f3f4f6;
  color:#0f172a;
  border:1px solid #e6e9ef;
}

.notice{
  padding:10px 12px;
  border-radius:8px;
  background:#ecfdf5;
  color:#065f46;
  margin-bottom:14px;
  border:1px solid #bbf7d0;
}

@media (max-width: 900px){
  .grid-3{ grid-template-columns: repeat(2, 1fr); }
  .grid-2{ grid-template-columns: 1fr; }
}

@media (max-width: 560px){
  .page{ margin:18px; padding:0 }
  .grid-3{ grid-template-columns: 1fr; }
  .grid-2{ grid-template-columns: 1fr; }
  .back-btn{ padding:8px 12px; font-size:14px }
}

  </style>
</head>
<body>
  <div class="page">
    <div class="top-bar">
      <a th:href="@{/api/tasks/dashboard}" class="back-btn">← Back to Dashboard</a>
    </div>
<div class="card">
  <h2>Add New User</h2>

  <div th:if="${message}" class="notice" th:text="${message}"></div>

  <form th:action="@{/api/tasks/postuserdata}" th:object="${user}" method="post">

    <!-- Row 1 -->
    <div class="grid-3">
      <div>
        <label for="firstName">First Name</label>
        <input id="firstName" type="text" th:field="*{firstName}" placeholder="First name" required />
      </div>

      <div>
        <label for="middleName">Middle Name</label>
        <input id="middleName" type="text" th:field="*{middleName}" placeholder="Middle name" />
      </div>

      <div>
        <label for="lastName">Last Name</label>
        <input id="lastName" type="text" th:field="*{lastName}" placeholder="Last name" required />
      </div>
    </div>

    <!-- Row 2 -->
    <div class="grid-3">
      <div>
        <label for="age">Age</label>
        <input id="age" type="number" th:field="*{age}" placeholder="Age" min="0" />
      </div>

      <div>
        <label for="email">Email</label>
        <input id="email" type="email" th:field="*{email}" placeholder="name@domain.com" />
      </div>

      <div>
        <label for="mobileNo">Mobile Number</label>
        <input
          id="mobileNo"
          type="text"
          th:field="*{mobileNo}"
          placeholder="Enter 10-digit mobile number"
          maxlength="10"
          pattern="^[0-9]{10}$"
          oninput="this.value = this.value.replace(/[^0-9]/g, '')"
          required
        />
        <p th:if="${#fields.hasErrors('mobileNo')}" th:errors="*{mobileNo}" style="color:red;font-size:13px;margin-top:6px;"></p>
      </div>
    </div>

    <!-- Row 3 -->
    <div class="grid-2">
      <div>
        <label for="userName">Username</label>
        <input id="userName" type="text" th:field="*{userName}" placeholder="Choose username" required />
      </div>

      <div>
        <label for="password">Password</label>
        <div style="position: relative;">
          <input 
            id="password" type="password" th:field="*{password}" placeholder="Password" required style="padding-right: 40px;"/>
          <span 
            onclick="togglePassword()" 
            style="position:absolute; right:12px; top:50%; transform:translateY(-50%); cursor:pointer; font-size:18px; color:#6b7280;"
            id="toggleIcon">👁</span>
        </div>
      </div>
    </div>

    <!-- Address -->
    <div style="width:100%; margin-bottom:18px;">
      <label for="address">Address</label>
      <textarea 
        id="address" 
        th:field="*{address}" 
        placeholder="Enter address"
        maxlength="1000"
        style="width:100%; min-height:110px;"
      ></textarea>
      <small id="address-count">0 / 1000</small>
    </div>

    <!-- Task -->
    <div style="width:100%; margin-bottom:18px;">
      <label for="task">Task</label>
      <input 
        id="task" 
        type="text" 
        th:field="*{task}" 
        placeholder="Task / Notes"
        maxlength="1000"
        style="width:100%;"
      />
      <small id="task-count">0 / 1000</small>
    </div>

    <div class="actions">
      <a th:href="@{/api/tasks/dashboard}" class="btn btn-secondary">Cancel</a>
      <button type="submit" class="btn btn-primary">Add User</button>
    </div>
  </form>
</div>
```

  </div>

  <script>
    // Password toggle
    function togglePassword() {
      const input = document.getElementById("password");
      const icon = document.getElementById("toggleIcon");
      if (input.type === "password") {
        input.type = "text";
        icon.textContent = "⊘";
      } else {
        input.type = "password";
        icon.textContent = "👁";
      }
    }

    // Character counters
    function updateCount(fieldId, countId) {
      const field = document.getElementById(fieldId);
      const count = document.getElementById(countId);

      // Initialize counter on page load
      count.textContent = `${field.value.length} / 1000`;

      field.addEventListener('input', () => {
        count.textContent = `${field.value.length} / 1000`;
      });
    }

    updateCount('address', 'address-count');
    updateCount('task', 'task-count');
  </script>

</body>
</html>
